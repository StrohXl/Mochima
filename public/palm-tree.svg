<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <linearGradient id="trunk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leaves" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Small blue circle above the island -->
  <circle cx="50" cy="25" r="8" fill="url(#water)" />
  <!-- Island -->
  <ellipse cx="50" cy="75" rx="40" ry="15" fill="url(#sand)" />
  <!-- Trunk -->
  <rect x="47" y="50" width="6" height="25" fill="url(#trunk)" />
  <!-- Leaves -->
  <ellipse cx="50" cy="35" rx="15" ry="10" fill="url(#leaves)" />
  <ellipse cx="40" cy="32" rx="12" ry="8" fill="url(#leaves)" transform="rotate(-20 40 32)" />
  <ellipse cx="60" cy="32" rx="12" ry="8" fill="url(#leaves)" transform="rotate(20 60 32)" />
  <ellipse cx="35" cy="38" rx="10" ry="6" fill="url(#leaves)" transform="rotate(-35 35 38)" />
  <ellipse cx="65" cy="38" rx="10" ry="6" fill="url(#leaves)" transform="rotate(35 65 38)" />
</svg>